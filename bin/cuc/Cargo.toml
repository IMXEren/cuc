[package]
name = "cuc-cli"
version = "0.4.0-dev.1"
edition = "2024"
description = "A CLI tool to generate clink argmatcher completions from the usage spec."
authors = { workspace = true }
license = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
categories = ["command-line-utilities"]

[[bin]]
name = "cuc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
cuc-lib = { workspace = true }
clap_usage = { git = "https://github.com/jdx/usage", tag = "v6.9.0" }
usage = { package = "usage-lib", git = "https://github.com/jdx/usage", tag = "v6.9.0", default-features = false }
kdl = "6"
indexmap = "2.13.0"
tera = "2"
which = "8.0.5"
winsplit = "0.1.0"
shell-words = "1.1.0"
scoop-shim = "0.1.1"
path-clean = "1.0.1"
